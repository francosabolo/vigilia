# Vigilia edge box: Frigate (detection) + Mosquitto (events) + seguria-bridge (cloud sync).
# Demo mode: mediamtx re-streams the videos in ./demo-videos as RTSP cameras.
#   docker compose --profile demo up -d
services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable
    restart: unless-stopped
    shm_size: "256mb"
    depends_on: [mosquitto]
    environment:
      FRIGATE_RTSP_BASE: ${FRIGATE_RTSP_BASE:-rtsp://mediamtx:8554}
    volumes:
      - ./frigate-config:/config
      - ./media:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs: { size: 1000000000 }
    ports:
      - "5000:5000"   # Frigate UI / API (only LAN; never expose publicly)
      - "8971:8971"

  bridge:
    build: ./bridge
    restart: unless-stopped
    depends_on: [mosquitto, frigate]
    env_file: .env
    environment:
      MQTT_HOST: mosquitto
      FRIGATE_URL: http://frigate:5000
      QUEUE_DIR: /data/queue
      FRIGATE_CONFIG: /frigate-config/config.yml
    volumes:
      - ./media/bridge-queue:/data/queue
      - ./frigate-config:/frigate-config

  # --- demo only: fake RTSP cameras from recorded videos ---
  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    profiles: [demo]
    restart: unless-stopped
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - ./demo-videos:/videos:ro
    ports:
      - "8554:8554"
