name: ci

on:
  push:
    branches: [main, develop, 'feat/**']
  pull_request:

defaults:
  run:
    working-directory: platform

jobs:
  platform:
    name: Platform (tests and code style)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      - name: Code style
        run: |
          vendor/bin/pint --test
          npx eslint .

      - name: Build assets
        run: npm run build

      - name: Tests
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan test

      - name: AI evaluation gate (offline, no API calls)
        run: php artisan vigilia:eval-gate

  edge:
    name: Edge bridge
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile bridge/bridge.py
